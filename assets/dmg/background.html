<!doctype html>
<meta charset="utf-8">
<!-- The installer window's background, 660 x 400 points: the Iceout colours, a menu bar along the
     top with its icons sliding away, and a glass strip along the bottom holding them, which is
     what the app does. Rendered to background.png and background@2x.png by
     scripts/render-dmg-background.sh. Finder draws the icon names over the picture (black on a
     light Mac, white on a dark one), so the middle stays a mid-tone blue that reads with both. -->
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden;
    background: linear-gradient(135deg, #19e3ff 0%, #3d7bff 38%, #6a4dff 72%, #c44dff 100%);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(360px 240px at 70px 10px, rgba(255,255,255,.38), transparent 70%),
                radial-gradient(300px 200px at 640px 400px, rgba(255,77,200,.35), transparent 70%); }
  /* the menu bar */
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: rgba(255,255,255,.18);
    box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 6px 18px rgba(20,10,90,.18); }
  .bar .menus { position: absolute; left: 14px; top: 0; height: 30px; display: flex; align-items: center; gap: 14px;
    font-size: 10.5px; color: rgba(255,255,255,.95); font-weight: 500; }
  .bar .menus b { font-weight: 700; }
  .bar .right { position: absolute; right: 12px; top: 0; height: 30px; display: flex; align-items: center; gap: 11px; }
  .bar .clock { font-size: 10.5px; font-weight: 500; color: rgba(255,255,255,.95); margin-left: 4px; }
  .ico { width: 16px; height: 16px; border-radius: 5px; }
  /* the icons that are sliding away to the left of the menu bar fade out */
  .slide { position: absolute; top: 7px; right: 160px; display: flex; gap: 9px; flex-direction: row-reverse;
    -webkit-mask-image: linear-gradient(270deg, #000 0%, #000 35%, transparent 100%); }
  .slide .ico { box-shadow: 0 2px 6px rgba(20,10,90,.25); }
  .mark { width: 16px; height: 16px; }
  /* the strip */
  .strip { position: absolute; left: 50%; top: 302px; transform: translateX(-50%); height: 46px; padding: 0 12px;
    display: flex; align-items: center; gap: 10px; border-radius: 8px; background: rgba(255,255,255,.22);
    box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset, 0 12px 30px rgba(20,10,90,.28); backdrop-filter: blur(8px); }
  .strip .ico { width: 26px; height: 26px; border-radius: 8px; box-shadow: 0 3px 8px rgba(20,10,90,.28); }
  svg.arrow { position: absolute; left: 0; top: 0; }
  .hint { position: absolute; left: 0; right: 0; top: 366px; text-align: center; font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,.82); }
  .hint b { color: #fff; font-weight: 700; }
</style>
<div class="glow"></div>

<div class="bar">
  <div class="menus"><span style="font-size:12px"></span><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Window</span></div>
  <div class="slide">
    <div class="ico" style="background:#ff5e5b"></div>
    <div class="ico" style="background:#ffc93c"></div>
    <div class="ico" style="background:#2ee6a6"></div>
    <div class="ico" style="background:#ffffff"></div>
    <div class="ico" style="background:#ff4dc8"></div>
    <div class="ico" style="background:#8bd3ff"></div>
  </div>
  <div class="right">
    <svg class="mark" viewBox="0 0 680 680"><g transform="translate(-172,-172)"><circle cx="512" cy="512" r="310" fill="#fff"/><path d="M396 170 L628 170 L512 720 Z" fill="#4a64ff"/></g></svg>
    <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.2 5.6 8.6a3.4 3.4 0 0 1 4.8 0zM2.6 5.8a7.6 7.6 0 0 1 10.8 0M0.6 3.4a10.5 10.5 0 0 1 14.8 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg width="22" height="11" viewBox="0 0 22 11"><rect x=".5" y=".5" width="18" height="10" rx="3" fill="none" stroke="#fff" opacity=".9"/><rect x="2" y="2" width="12" height="7" rx="1.6" fill="#fff"/><rect x="19.5" y="3.6" width="1.6" height="3.8" rx=".8" fill="#fff"/></svg>
    <span class="clock">9:41</span>
  </div>
</div>

<!-- an arrow from the app to Applications, between the two icons (centre height 190) -->
<svg class="arrow" width="660" height="400" viewBox="0 0 660 400">
  <defs><linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="392" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient></defs>
  <line x1="262" y1="190" x2="392" y2="190" stroke="url(#fade)" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 11"/>
  <path d="M384 177 L398 190 L384 203" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<div class="strip">
  <div class="ico" style="background:#ff5e5b"></div>
  <div class="ico" style="background:#ffc93c"></div>
  <div class="ico" style="background:#2ee6a6"></div>
  <div class="ico" style="background:#ffffff"></div>
  <div class="ico" style="background:#ff4dc8"></div>
  <div class="ico" style="background:#8bd3ff"></div>
</div>
<div class="hint">Drag <b>Ice Out</b> into Applications. Your hidden icons wait in one click.</div>
